[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mkdocs-panzoom-plugin"
version = "0.2.2"
description = "MkDocs Plugin to enable pan & zoom on images and mermaid diagrams"
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "PLAYG0N", email = "playg0nofficial@gmail.com" },
  { name = "elgalu", email = "elgalu3@gmail.com" },
]
keywords = ["mkdocs", "zoom", "pan", "plugin", "mermaid", "images"]
classifiers = [
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.10"
dependencies = [
    "mkdocs>=1.0.4",
    "beautifulsoup4>=4.9.0",
    "mkdocs-literate-nav>=0.6.2",
]

[dependency-groups]
dev = [
  "awslambdaric>=3.1.0",
  "boto3>=1.35.0",
  "botocore>=1.35.0",
  "cfnresponse>=1.1.5",
  "mkdocs>=1.6.1",
  "mkdocs-git-authors-plugin>=0.10.0",
  "mkdocs-git-revision-date-localized-plugin>=1.4.7",
  "mkdocs-literate-nav>=0.6.2",
  "mkdocs-material>=9.6.14",
  "mkdocs-mermaid2-plugin>=1.2.1",
  "mkdocs-panzoom-plugin",
  "mkdocs-d2-plugin>=1.6.0",
  "mkdocs-redirects>=1.2.2",
  "mkdocs-section-index>=0.3.10",
  "mkdocs-glightbox>=0.5.1",
  "mypy>=1.16.1",
  "pylint>=3.3.7",
  "pymdown-extensions>=10.16",
  "pyyaml>=6.0.1",
  "types-pyyaml>=6.0.12.20250516",
  "mkdocs-toggle-sidebar-plugin>=0.0.6",
  "mkdocs-material-mark-as-read>=0.0.1",
]
docs = ["mkdocs>=1.1.2", "mkdocs-material>=9.6.7", "mkdocs-d2-plugin"]

[project.urls]
Homepage = "https://github.com/elgalu/mkdocs-panzoom"
Repository = "https://github.com/elgalu/mkdocs-panzoom.git"
Documentation = "https://playg0n.github.io/mkdocs-panzoom/"
Issues = "https://github.com/elgalu/mkdocs-panzoom/issues"

[project.entry-points."mkdocs.plugins"]
panzoom = "mkdocs_panzoom_plugin.plugin:PanZoomPlugin"

[tool.hatch.build.targets.wheel]
packages = ["mkdocs_panzoom_plugin"]

[tool.uv]
native-tls = true

[tool.codespell]
skip = 'uv.lock'

[tool.ruff]
line-length = 99
target-version = "py310"

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"
# Use spaces around operators
indent-style = "space"
# Respect magic trailing commas
skip-magic-trailing-comma = false
# Automatically detect line endings
line-ending = "auto"

[tool.ruff.lint]
# use ruff defaults: Flake8's F rules, along with a subset of the E rules, omitting any stylistic rules
# that overlap with the use of a formatter, like Black.
fixable = ["ALL"]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "UP",   # pyupgrade
  "S",    # flake8-bandit
  "PGH",  # pygrep-hooks
  "T100", # debug statements
  "W291", # trailing whitespace
  "W292", # no newline at end of file
  "D",    # pydocstyle - enable docstring checks
]
ignore = [
  "E501", # line too long, handled by formatter
  "B008", # do not perform function calls in argument defaults
  "C901", # too complex
  "S101", # use of assert
  # https://docs.astral.sh/ruff/rules/#pydocstyle-d
  "D203", # 1 blank line required before class docstring (conflicts with D211)
  "D213", # Multi-line docstring summary should start at the second line (conflicts with D212)
  "D417", # Missing argument descriptions in docstring - TODO: fix this later
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
# Temporarily disable strict typing for existing code
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
# Additional strict checks to match Pylance - disabled for now
disallow_any_generics = false
exclude = ["tests/.*"]

# Ignore missing imports for dependencies without type stubs
[[tool.mypy.overrides]]
module = ["mkdocs", "mkdocs.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
junit_family = "xunit2"
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = [
  "-ra",
  "-q",
  "--strict-markers",
  "--strict-config",
  "--cov=mkdocs_panzoom_plugin",
  "--cov-report=term-missing",
  "--cov-report=html",
  "--cov-report=xml",
]

[tool.coverage.run]
source = ["mkdocs_panzoom_plugin"]
omit = ["*/venv/*", "*/.venv/*", "*/tests/*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "if self.debug:",
  "if settings.DEBUG",
  "raise AssertionError",
  "raise NotImplementedError",
  "if 0:",
  "if __name__ == .__main__.:",
]
